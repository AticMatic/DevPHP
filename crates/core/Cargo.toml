[package]
name = "devphp-core"
version = "0.1.0"
edition = "2021"
description = "Core engine for DevPHP – process management, binary downloads, and service orchestration"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
zip = "2"
flate2 = "1"
tar = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
parking_lot = "0.12"
notify = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
